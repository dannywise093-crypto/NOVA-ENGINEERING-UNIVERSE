name: Engineering Universe CAD checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile CAD worker
        run: python -m py_compile cad-worker/server.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check serverless API syntax
        run: |
          node --check api/engineer.js
          node --check api/cad-control.js
          node --check api/cascade-control.js
